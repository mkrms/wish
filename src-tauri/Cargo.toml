[package]
name = "wish"
version = "0.1.0"
description = "Wish — SE 個人向けのシンプルで高UXなタスク管理アプリ"
authors = ["Wish"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
