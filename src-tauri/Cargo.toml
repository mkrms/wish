[package]
name = "wish"
version = "0.2.0"
description = "Wish — SE 個人向けのシンプルで高UXなタスク管理アプリ"
authors = ["Wish"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# アプリ内自動更新（GitHub Releases の latest.json を minisign 公開鍵で検証）。D-030
tauri-plugin-updater = "2"
# 更新インストール後の再起動（relaunch）に使う。
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 一時ピン: time 0.3.52 (2026-06-30 公開) が cookie 0.18.1 のコンパイルを壊すため、
# 直前の 0.3.51 に固定（Cargo.lock 未コミットによる非再現性への対症。D-022）。
time = "=0.3.51"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
